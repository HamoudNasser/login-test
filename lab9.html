<!DOCTYPE html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events and Validation</title>

    <style>
        body {
            background-color: white;
        }

        h2 {
            text-align: center;
        }

        form {
            background-color: #f2f2f2;
            width: 400px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid #888787;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #message {
            display: block;
            margin: 10px 0;
        }

        input[type="submit"] {
            width: 100%;
            background-color: #aaaaaa;
            color: white;
            padding: 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>JavaScript Events and Validation</h2>

    <form id="registrationForm">

        <label for="fname">First Name</label>
        <input type="text" id="fname" placeholder="Your name.." value="">

        <label for="lname">Last Name</label>
        <input type="text" id="lname" placeholder="Your last name..">

        <label for="country">Country</label>
        <select id="country" name="country">
            <option value="KSA">Saudi Arabia</option>
            <option value="kuwait">Kuwait</option>
            <option value="Qatar">Qatar</option>
        </select>

        <span id="message"></span>

        <input id="submit" type="submit" value="Submit">

    </form>

    <script src="lab9.js"></script>

</body>
</html>
